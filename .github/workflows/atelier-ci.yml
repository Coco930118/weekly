name: Atelier CI

on:
  push:
    branches:
      - 'atelier/**'
    paths:
      - 'atelier/**'
      - 'docs/coco_atelier_company_spec.md'
      - '.github/workflows/atelier-ci.yml'
  pull_request:
    paths:
      - 'atelier/**'
      - 'docs/coco_atelier_company_spec.md'
      - '.github/workflows/atelier-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python3 -m unittest discover -s atelier/tests -v
      - name: JavaScript tests
        run: node --test atelier/tests/*.test.mjs

# v1.2 verification

  browser-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: President desk mobile browser simulation
        run: python3 atelier/tests/president_desk_browser_check.py

  browser-pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: President desk PC browser simulation
        run: python3 atelier/tests/president_desk_pc_check.py

  openai-x01-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/atelier/openai-x01-probe'
    runs-on: ubuntu-latest
    env:
      ATELIER_OPENAI_LIVE: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: X01 P1-P3 live OpenAI probe
        run: python3 atelier/tests/openai_x01_live_probe.py
