# fly.toml app configuration file generated for cocoatelier on 2026-10-11T01:46:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cocoatelier'
primary_region = 'nrt'

[build]

[[mounts]]
  source = 'coco_atelier_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
